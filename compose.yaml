services:
  default:
    build: .
    command: tail -f /dev/null
    working_dir: /workspace
    volumes:
      - D:/dissertation_repos:/workspace
    environment:
      - PYTHONPATH=/workspace
    healthcheck:
      test: ["CMD", "python3", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s